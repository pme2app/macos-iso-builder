name: Build Full Installer ISO/DMG image

on:
  workflow_dispatch:
    inputs:
      macos_version:
        description: "Choose a macOS version to build."
        required: true
        type: choice
        options:
          - ''
          - 'Tahoe'
          - 'Sequoia'
          - 'Sonoma'
          - 'Ventura'
          - 'Monterey'
          - 'Big Sur'
          - 'Catalina'
          - 'Mojave'
          - 'High Sierra'
          - 'Sierra'
          - 'El Capitan'
          - 'Yosemite'
          - 'Mavericks'
          - 'Mountain Lion'
          - 'Lion'
      image_format:
        description: "Choose 'iso' for virtual machines, 'dmg' for flash to USB drive."
        required: true
        type: choice
        options:
          - ''
          - 'iso'
          - 'dmg'

jobs:
  preflight:
    if: ${{ inputs.macos_version != '' && inputs.image_format != '' }}
    runs-on: ubuntu-slim
    timeout-minutes: 5
    outputs:
      _build: ${{ steps.check.outputs._build }}

    steps:
      - name: Preflight
        id: check
        run: |
          echo "_build=false" >> $GITHUB_OUTPUT
          sum() { printf '%s\n' "$@" >> "$GITHUB_STEP_SUMMARY"; }

          # Third time's the charm: force a fresh build after a few attempts
          if [ ${{ github.run_attempt }} -ge 3 ] || [ ${{ github.run_number }} -ge 3 ]; then
            echo "_build=true" >> $GITHUB_OUTPUT
            exit 0
          fi

          VERSION_KEY="macOS_$(echo "${{ inputs.macos_version }}" | tr '[:upper:]' '[:lower:]' | tr ' ' '_')"
          FORMAT="${{ inputs.image_format }}"

          # A star is a shortcut: go straight to a fresh build without searching
          STARRED=false
          PAGE=1
          while [ $PAGE -le 5 ]; do
            DATA=$(curl -s \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
              "https://api.github.com/users/${{ github.actor }}/starred?per_page=100&page=${PAGE}")
            [ "$(echo "$DATA" | jq -r 'type')" = "array" ] || break
            echo "$DATA" | jq -e 'any(.[]; .full_name == "LongQT-sea/macos-iso-builder")' > /dev/null && STARRED=true && break
            [ "$(echo "$DATA" | jq 'length')" -lt 100 ] && break
            PAGE=$((PAGE + 1))
          done

          if [ "$STARRED" = "true" ]; then
            echo "_build=true" >> $GITHUB_OUTPUT
            exit 0
          fi

          # Skip only when the Recent Forks List has a Full Installer artifact
          # matching BOTH the requested macOS version and image format.
          # Recovery ISOs are a different product, so exclude them.
          # An ISO-only match must not suppress a DMG build (and vice versa).
          BODY=$(curl -s \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            "https://api.github.com/repos/LongQT-sea/macos-iso-builder/releases/latest" \
            | jq -r '.body // ""')

          MATCH=""
          if [ -n "$BODY" ]; then
            ARTIFACTS=$(echo "$BODY" \
              | grep -oiE 'macOS_[A-Za-z0-9_.-]+\.(dmg\.img|iso)' \
              | grep -viF '_Recovery' \
              | sort -u)
            if [ "$FORMAT" = "dmg" ]; then
              MATCH=$(echo "$ARTIFACTS" | grep -iF "$VERSION_KEY" | grep -F '.dmg.img' | head -1)
            else
              MATCH=$(echo "$ARTIFACTS" | grep -iF "$VERSION_KEY" | grep -E '\.iso$' | head -1)
            fi
          fi

          if [ -n "$MATCH" ]; then
            sum "## Found **${MATCH}** in the [Recent Forks List](https://github.com/LongQT-sea/macos-iso-builder/releases/latest)" \
                "" \
                "An image with the same macOS version and format already exists. Download it instead of building a duplicate:" \
                "" \
                "1. Open the forks list above" \
                "2. Find the artifact **${MATCH}** and open its workflow run" \
                "3. Scroll down to the **Artifacts** section to download" \
                "" \
                "> Star [LongQT-sea/macos-iso-builder](https://github.com/LongQT-sea/macos-iso-builder) to skip this search and always build fresh. :star:"
          else
            sum "No matching ${FORMAT} image for ${VERSION_KEY} in the Recent Forks List. Starting build..." \
                "" \
                "> Star [LongQT-sea/macos-iso-builder](https://github.com/LongQT-sea/macos-iso-builder) to skip this search and always build fresh. :star:"
            echo "_build=true" >> $GITHUB_OUTPUT
          fi

  build-macos-image:
    needs: preflight
    if: needs.preflight.outputs._build == 'true'
    runs-on: macos-15-intel
    timeout-minutes: 80

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: System Information
        run: |
          echo "Runner OS: $(sw_vers -productName) $(sw_vers -productVersion)"
          echo "Architecture: $(uname -m)"
          echo ""
          df -h $(mktemp)
          echo ""
          echo "RAM: $(top -l 1 | grep PhysMem)"
          echo ""
          echo "CPU: $(sysctl -n machdep.cpu.brand_string)"

      - name: Create macOS image
        id: create_image
        run: |
          ./mkmaciso "${{ inputs.macos_version }}" "${{ inputs.image_format }}"
          if [ "${{ inputs.image_format }}" == "iso" ]; then
            echo "image_name=$(basename *.iso)" >> $GITHUB_OUTPUT
          else
            echo "image_name=$(basename *.dmg.img)" >> $GITHUB_OUTPUT
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          path: ${{ steps.create_image.outputs.image_name }}
          compression-level: 0
          retention-days: 15
          archive: false

      - name: Summary
        if: always()
        run: |
          sum() { printf '%s\n' "$@" >> "$GITHUB_STEP_SUMMARY"; }

          if [ "${{ steps.create_image.outcome }}" == "failure" ]; then
            sum "## Download macOS failed" \
                "" \
                "> [!WARNING]" \
                "> This runner may have network issues. Please **re-run the workflow** to try a different runner."
          elif [ "${{ job.status }}" == "success" ]; then
            if [ "${{ inputs.image_format }}" == "iso" ]; then
              sum "## Successfully built $(basename *.iso)" \
                  "" \
                  "> [!Important]" \
                  "> This ISO image is intended for creating macOS virtual machines on Proxmox VE, QEMU, and VMware."
            else
              sum "## Successfully built $(basename *.dmg.img)" \
                  "" \
                  "> [!Important]" \
                  '> This DMG image is intended for flashing to USB drive using [Rufus](https://rufus.ie/en/#download) *(Windows)* or `dd` *(Linux)*.'
            fi
            sum "" \
                "> [!TIP]" \
                "> Enable [Cloudflare WARP](https://one.one.one.one/) for faster download from GitHub artifact."
          fi
